[project]
name = "goodcatch-pipeline"
version = "0.1.0"
description = "Checks the posts written by the goodcatch.in weekly pipeline before they are published."
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0.2"]

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8.3", "ruff>=0.8", "types-pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
