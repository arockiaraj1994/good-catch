baseURL: "https://goodcatch.in/"
locale: "en-US"
title: "Good Catch"

# Content settings
pagination:
  pagerSize: 30
enableRobotsTXT: true
titleCaseStyle: none

outputs:
  home:
    - HTML
    - RSS

taxonomies:
  tag: tags

params:
  tagline: "Real AI mistakes, explained"
  description: "Every week we pick real mistakes made by AI tools, explain what went wrong in plain words, and open them up for discussion. No tech background needed."

  # Giscus comments (GitHub Discussions). Rendered by layouts/partials/giscus.html;
  # its light/dark theme follows the site toggle.
  giscus:
    repo: "arockiaraj1994/good-catch"
    repoID: "R_kgDOTw50cw"
    category: "catches"
    categoryID: "DIC_kwDOTw50c84DC3x1"
    mapping: "pathname"
    reactions-enabled: "1"
    emit-metadata: "0"
    input-position: "bottom"
    lang: "en"

menus:
  main:
    - name: "All mistakes"
      url: "/posts/"
      weight: 1
    - name: "By week"
      url: "/weeks/"
      weight: 2
    - name: "Topics"
      url: "/tags/"
      weight: 3
