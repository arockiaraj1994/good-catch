{{ with site.Params.giscus }}
<script src="https://giscus.app/client.js"
        data-repo="{{ .repo }}"
        data-repo-id="{{ .repoID }}"
        data-category="{{ .category }}"
        data-category-id="{{ .categoryID }}"
        data-mapping="{{ .mapping }}"
        data-reactions-enabled="{{ index . "reactions-enabled" }}"
        data-emit-metadata="{{ index . "emit-metadata" }}"
        data-input-position="{{ index . "input-position" }}"
        data-theme="{{ .theme }}"
        data-lang="{{ .lang }}"
        data-loading="lazy"
        crossorigin="anonymous"
        async>
</script>
<noscript><p class="meta">Comments need JavaScript and a GitHub account.</p></noscript>
{{ end }}
