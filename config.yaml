baseURL: "https://arockiaraj1994.github.io/good-catch/"
languageCode: "en-us"
title: "Good Catch"
theme: "PaperMod"

# Content settings
paginate: 10
enableRobotsTXT: true

# Output settings
outputs:
  home:
    - HTML
    - RSS

# Taxonomies
taxonomies:
  category: categories
  tag: tags

# Giscus Comments Configuration
params:
  giscus:
    repo: "arockiaraj1994/good-catch"
    repoID: "R_kgDOTw50cw"
    category: "General"
    categoryID: "DIC_kwDOTw50c84DC3x1"
    mapping: "pathname"
    reactions-enabled: "1"
    emit-metadata: "0"
    input-position: "bottom"
    theme: "dark"
    lang: "en"

# Menu configuration (optional, customize as needed)
menus:
  main:
    - name: "Home"
      url: "/"
      weight: 1
    - name: "Posts"
      url: "/posts/"
      weight: 2
