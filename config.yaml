baseURL: "https://goodcatch.in/"
locale: "en-US"
title: "Good Catch"

# Content settings
pagination:
  pagerSize: 30
enableRobotsTXT: true
titleCaseStyle: none

outputs:
  home:
    - HTML
    - RSS

taxonomies:
  tag: tags

params:
  tagline: "AI fails, hallucinations and deepfakes, explained simply"
  description: "AI hallucinations, rogue AI agents, deepfakes: every week we pick real AI fails from ChatGPT, Gemini, Copilot and more, explain them in simple words, and open them up for discussion. No tech background needed."
  keywords: ["AI fails", "AI mistakes", "AI hallucination", "AI agent", "deepfake", "prompt injection", "AI bias", "ChatGPT", "generative AI"]

  # Giscus comments (GitHub Discussions). Rendered by layouts/partials/giscus.html;
  # its light/dark theme follows the site toggle.
  giscus:
    repo: "arockiaraj1994/good-catch"
    repoID: "R_kgDOTw50cw"
    category: "catches"
    categoryID: "DIC_kwDOTw50c84DC3x1"
    mapping: "pathname"
    reactions-enabled: "1"
    emit-metadata: "0"
    input-position: "bottom"
    lang: "en"

menus:
  main:
    - name: "All AI fails"
      url: "/posts/"
      weight: 1
    - name: "By week"
      url: "/weeks/"
      weight: 2
    - name: "AI buzzwords"
      url: "/buzzwords/"
      weight: 3
    - name: "Topics"
      url: "/tags/"
      weight: 4
