baseURL: "https://goodcatch.in/"
locale: "en-US"
title: "Good Catch"

# Content settings
pagination:
  pagerSize: 30
enableRobotsTXT: true
titleCaseStyle: none

outputs:
  home:
    - HTML
    - RSS

taxonomies:
  tag: tags

params:
  description: "Real AI mistakes, one post each, decoded weekly. Discuss what went wrong."

  # Giscus comments (GitHub Discussions). Rendered by layouts/partials/giscus.html.
  giscus:
    repo: "arockiaraj1994/good-catch"
    repoID: "R_kgDOTw50cw"
    category: "catches"
    categoryID: "DIC_kwDOTw50c84DC3x1"
    mapping: "pathname"
    reactions-enabled: "1"
    emit-metadata: "0"
    input-position: "bottom"
    theme: "dark"
    lang: "en"

menus:
  main:
    - name: "catches"
      url: "/posts/"
      weight: 1
    - name: "weeks"
      url: "/weeks/"
      weight: 2
    - name: "tags"
      url: "/tags/"
      weight: 3
